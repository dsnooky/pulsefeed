<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PulseFeed Story</title><meta name="description" content="Original stories and perspectives from PulseFeed."><link rel="stylesheet" href="/styles.css"></head><body><header><div class="nav wrap"><a class="brand" href="/"><i>P</i><span>pulsefeed<small>STORIES IN MOTION</small></span></a><a href="/">← Back to stories</a></div></header><main class="wrap" style="max-width:820px;padding-top:55px;padding-bottom:80px"><article id="article"><p class="muted">Loading story…</p></article></main><script>
const slug=location.pathname.split("/").pop();fetch("/api/posts/"+encodeURIComponent(slug)).then(r=>{if(!r.ok)throw Error();return r.json()}).then(p=>{document.title=p.title+" | PulseFeed";document.querySelector('meta[name="description"]').content=p.excerpt;document.getElementById("article").innerHTML=`<p class="eyebrow">${p.category} · PULSEFEED ORIGINAL</p><h1 style="font-size:clamp(35px,6vw,58px);letter-spacing:-2px;line-height:1.08">${esc(p.title)}</h1><p class="muted">Published ${new Date(p.publishedAt).toLocaleDateString()}</p><p style="font-size:18px;color:#c5cde1">${esc(p.excerpt)}</p><div style="white-space:pre-wrap;line-height:1.9;margin-top:35px">${esc(p.body)}</div><p class="muted" style="margin-top:40px">PulseFeed original story. Contact the editorial team for corrections.</p>`}).catch(()=>document.getElementById("article").textContent="Story not found.");
function esc(s){return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
</script></body></html>
